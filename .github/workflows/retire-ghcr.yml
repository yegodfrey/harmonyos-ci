name: Retire ghcr package (one-shot)

# 一次性删除任务（2026-10-03）：linux 镜像工厂退役后 ghcr.io/yegodfrey/harmonyos-ci
# 零消费，业主令彻底清除。本 workflow 删除本仓关联的 container package 后即被移除，
# 不留常驻面。GITHUB_TOKEN 显式带 packages:write（权限枚举无 delete；删除能力含于 write。本地 PAT 无 packages 作用域）。
on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  delete-package:
    runs-on: ubuntu-latest
    steps:
      - name: Delete container package harmonyos-ci (all versions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          CODE=$(curl -s -o /tmp/del-resp.json -w "%{http_code}" \
            -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/harmonyos-ci")
          echo "delete-http=$CODE"
          cat /tmp/del-resp.json || true
          test "$CODE" = "204"
      - name: Verify gone (expect 404)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/user/packages/container/harmonyos-ci")
          echo "verify-http=$CODE (404=已删)"
          test "$CODE" = "404"
